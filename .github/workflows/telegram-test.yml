name: Test notifica Telegram

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  telegram-test:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Invia notifica di prova nel formato disponibilita
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          from monitor import PRODUCTS, TARGETS, availability_message, notify
          sku = "MK2F4QL/A"
          message = (
              "PROVA - DISPONIBILITA SIMULATA, NON REALE\n\n"
              + availability_message(sku, PRODUCTS[sku], TARGETS["carosello"])
          )
          notify(message)
          print("NOTIFICA DI PROVA INVIATA: Telegram ha confermato ok=true")
          PY

