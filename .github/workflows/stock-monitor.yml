
name: iPhone Stock Monitor - Automatico

on:
  schedule:
    # UTC: minuti 2, 7, 12, ..., 57 di ogni ora (ogni 5 minuti).
    - cron: "2-59/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: iphone-stock-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Registra origine esecuzione
        env:
          TRIGGER_EVENT: ${{ github.event_name }}
          TRIGGER_SCHEDULE: ${{ github.event.schedule }}
        run: |
          echo "Evento: $TRIGGER_EVENT"
          echo "Pianificazione UTC: $TRIGGER_SCHEDULE"
          date -u "+Avvio UTC: %Y-%m-%dT%H:%M:%SZ"

      - name: Scarica repository
        uses: actions/checkout@v4
        with:
          # Queued runs must check the current state, not the SHA captured at dispatch.
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Controlla disponibilita
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python monitor.py

      - name: Salva ultimo stato
        if: ${{ always() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stock_state.json
          if ! git diff --cached --quiet; then
            git commit -m "Update Apple stock state"
            # Preserve remote commits made while this check was running.
            for attempt in 1 2 3; do
              git pull --rebase origin main
              if git push origin HEAD:main; then
                exit 0
              fi
            done
            echo "Impossibile salvare lo stato dopo 3 tentativi" >&2
            exit 1
          fi


